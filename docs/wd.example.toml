# Example config for the `wd` core. Point $WD_CONFIG at this file to try it
# without touching ~/.config/workdash/config.toml, which the old TUI still uses.
#
# Actions declare argv (a list, so nothing needs quoting), the facets they need,
# and where they run: `pane` for a tmux window, `capture` to run and show output.

[[repos]]
root = "~/code/your-repo"

[[actions]]
id = "shell"
label = "open shell"
needs = ["worktree"]
where = "pane"
argv = ["bash"]

[[actions]]
id = "agent"
label = "launch claude"
needs = ["worktree"]
where = "pane"
argv = ["claude"]

[[actions]]
# `capture` runs the command and shows its output. It suits one-shot operations
# whose result you read once — not state you should simply be able to see, which
# belongs in a facet.
id = "gwt-delete"
label = "delete worktree"
needs = ["worktree"]
scope = "remote"
where = "capture"
shell = true
argv = ["gwt-delete", "{branch}"]
cwd = "{repo}"

[[actions]]
id = "gwt"
label = "create worktree"
needs = ["!worktree"]
where = "pane"
shell = true
argv = ["gwt", "{branch}"]
cwd = "{repo}"

# `attach` connects to the session that already exists and creates nothing. It
# takes no argv and implies needs = ["session"].
[[actions]]
id = "attach"
label = "attach session"
where = "attach"
